services:
  postgres:
    image: postgres:16-alpine
    container_name: eclora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eclora
      POSTGRES_PASSWORD: eclora
      POSTGRES_DB: eclora
    # 5433 on the host: 5432 is taken by the Homebrew postgres@15 install.
    ports:
      - '5433:5432'
    volumes:
      - eclora-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eclora -d eclora']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eclora-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eclora.dz
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - eclora-pgadmin:/var/lib/pgadmin
      # Pre-registers the Eclora server so pgAdmin opens ready to use.
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eclora-db:
  eclora-pgadmin:
